version: 2

models:
  - name: dim_provider
    description: One row per billing provider (NPI), with how their practice site was matched.
    columns:
      - name: npi
        data_tests: [unique, not_null]
      - name: site_match_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['billing_zip_match', 'best_available_site', 'not_in_directory']

  - name: dim_practice
    description: One row per practice (CMS group PAC ID), plus 'INDEPENDENT' and 'NOT_IN_DIRECTORY' buckets.
    columns:
      - name: practice_id
        data_tests: [unique, not_null]

  - name: dim_location
    description: One row per practice site (CMS address ID, or billing ZIP when the provider is not in the directory), with state name and region.
    columns:
      - name: location_id
        data_tests: [unique, not_null]
      - name: region
        data_tests: [not_null]

  - name: dim_service
    description: One row per procedure code (HCPCS), with its service line (rule-based for Mohs codes, Cortex AI_CLASSIFY for the rest).
    columns:
      - name: hcpcs_code
        data_tests: [unique, not_null]
      - name: service_line_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['rule', 'ai']

  - name: fct_services
    description: One row per provider, procedure and place of service. Dollar totals = CMS average x services.
    columns:
      - name: npi
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: npi
      - name: practice_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_practice')
                field: practice_id
      - name: location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: hcpcs_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_service')
                field: hcpcs_code