name: 'derm_dbt'
version: '1.0.0'

# Connection details live in ~/.dbt/profiles.yml (see README).
profile: 'derm_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# staging + intermediate: views over RAW, no business logic beyond cleanup and matching
# marts: tables for reporting (star schema)
models:
  derm_dbt:
    staging:
      +materialized: view
      +schema: STAGING
    intermediate:
      +materialized: view
      +schema: STAGING
    marts:
      +materialized: table
      +schema: MARTS

seeds:
  derm_dbt:
    +schema: STAGING
